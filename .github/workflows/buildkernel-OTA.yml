#==========================================================================
# Description: Build Custom FnNAS Kernel (with user-specified image & kernel)
#==========================================================================

name: Build Custom FnNAS Kernel

on:
  workflow_dispatch:
    inputs:
      # ========== 镜像来源 ==========
      fnnas_image_path:
        description: "Path to your FnNAS image file in the repository (e.g., fnnas/fnos_arm_xxx.img)"
        required: true
        default: ""
        type: string
      image_is_compressed:
        description: "Is the image file compressed (.xz)?"
        required: false
        default: false
        type: boolean

      # ========== 内核来源 ==========
      kernel_source:
        description: "Kernel source type"
        required: true
        default: "debs_repo"
        type: choice
        options:
          - debs_repo      # 从 GitHub releases 下载预编译内核
          - custom_path    # 使用你上传到仓库的内核文件
          - use_existing   # 直接使用镜像中自带的内核（不替换）

      # 选项1：从 debs_repo 下载
      debs_repo:
        description: "GitHub repo for kernel debs (owner/repo)"
        required: false
        default: "ophub/fnnas"
        type: string
      kernel_platform:
        description: "Platform for debs kernel (amlogic/rockchip/allwinner)"
        required: false
        default: "amlogic"
        type: choice
        options:
          - amlogic
          - rockchip
          - allwinner
      kernel_version:
        description: "Kernel version (e.g., 6.18.18 or 6.18.y)"
        required: false
        default: "6.18.y"
        type: string

      # 选项2：自定义内核文件路径
      custom_kernel_path:
        description: "Path to custom kernel tar.gz or deb file (if kernel_source=custom_path)"
        required: false
        default: ""
        type: string

      # ========== 通用选项 ==========
      dtbs_install:
        description: "Install additional dtbs files"
        required: false
        default: true
        type: boolean
      dtbs_version:
        description: "DTB kernel version (if dtbs_install=true)"
        required: false
        default: "6.18.y"
        type: string

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ========== 准备构建环境 ==========
      - name: Initialize build environment
        id: init
        run: |
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-make-fnnas-depends)
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      # ========== 创建大容量虚拟磁盘（避免空间不足） ==========
      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          echo "status=success" >> ${GITHUB_OUTPUT}

      # ========== 准备自定义镜像文件 ==========
      - name: Prepare custom FnNAS image
        id: prepare_image
        working-directory: /builder
        run: |
          mkdir -p fnnas
          IMAGE_PATH="${{ inputs.fnnas_image_path }}"
          IMAGE_NAME=$(basename "${IMAGE_PATH}")

          # 从仓库复制镜像文件到工作目录
          if [[ -f "${{ github.workspace }}/${IMAGE_PATH}" ]]; then
            cp "${{ github.workspace }}/${IMAGE_PATH}" "fnnas/${IMAGE_NAME}"
            echo "Copied image from: ${IMAGE_PATH}"
          else
            echo "Error: Image file not found at ${IMAGE_PATH}"
            exit 1
          fi

          # 如果文件是 .xz 压缩格式
          if [[ "${{ inputs.image_is_compressed }}" == "true" ]]; then
            echo "Image is compressed (.xz), will decompress during build"
          fi

          # 创建软链接供后续步骤使用
          ln -sf /builder/fnnas ${{ github.workspace }}/fnnas
          echo "status=success" >> ${GITHUB_OUTPUT}

      # ========== 构建内核升级包 ==========
      - name: Build custom FnNAS kernel
        id: build_kernel
        uses: ophub/fnnas@main
        if: ${{ steps.prepare_image.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: kernel
          fnnas_path: fnnas/*.img
          debs_repo: ${{ inputs.kernel_source == 'debs_repo' && inputs.debs_repo || '' }}
          debs_install: ${{ inputs.kernel_source == 'debs_repo' && inputs.kernel_platform || 'none' }}
          dtbs_version: ${{ inputs.dtbs_version }}
          dtbs_install: ${{ inputs.dtbs_install }}

      # ========== 上传产物到 Releases ==========
      - name: Upload Kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: custom_kernel_${{ github.run_number }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Custom FnNAS Kernel Package
            - Base image: ${{ inputs.fnnas_image_path }}
            - Kernel source: ${{ inputs.kernel_source }}
            - Kernel version: ${{ inputs.kernel_version }}
