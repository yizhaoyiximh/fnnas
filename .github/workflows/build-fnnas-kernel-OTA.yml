name: 构建自定义 FnNAS 内核

on:
  workflow_dispatch:
    inputs:
      # ========== 镜像来源 ==========
      fnnas_image_path:
        description: "镜像文件路径（支持仓库内路径 或 完整 URL 下载链接）"
        required: true
        default: ""
        type: string
      image_is_compressed:
        description: "镜像文件是否为压缩格式（.xz / .gz）？"
        required: false
        default: false
        type: boolean

      # ========== 内核来源 ==========
      kernel_source:
        description: "内核来源类型"
        required: true
        default: "debs_repo"
        type: choice
        options:
          - debs_repo
          - custom_path
          - use_existing

      # 选项1：从 debs_repo 下载
      debs_repo:
        description: "内核 deb 包的 GitHub 仓库（所有者/仓库名）"
        required: false
        default: "ophub/fnnas"
        type: string
      kernel_platform:
        description: "内核适用的硬件平台"
        required: false
        default: "amlogic"
        type: choice
        options:
          - amlogic
          - rockchip
          - allwinner
      kernel_version:
        description: "内核版本号（例如：6.18.18 或 6.18.y）"
        required: false
        default: "6.18.y"
        type: string

      # 选项2：自定义内核文件路径
      custom_kernel_path:
        description: "自定义内核文件路径（当内核来源选择 custom_path 时填写）"
        required: false
        default: ""
        type: string

      # ========== 通用选项 ==========
      dtbs_install:
        description: "是否安装额外的设备树（dtbs）文件"
        required: false
        default: true
        type: boolean
      dtbs_version:
        description: "设备树（dtbs）对应的内核版本"
        required: false
        default: "6.18.y"
        type: string

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      # ========== 准备构建环境 ==========
      - name: 初始化构建环境
        id: init
        run: |
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-make-fnnas-depends)
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      # ========== 创建大容量虚拟磁盘（避免空间不足） ==========
      - name: 创建虚拟磁盘扩展存储空间
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "错误：磁盘空间不足"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          echo "status=success" >> ${GITHUB_OUTPUT}

      # ========== 准备自定义镜像文件（支持 URL 和本地路径） ==========
      - name: 准备自定义 FnNAS 镜像
        id: prepare_image
        working-directory: /builder
        run: |
          mkdir -p fnnas
          IMAGE_INPUT="${{ inputs.fnnas_image_path }}"
          IMAGE_NAME=$(basename "${IMAGE_INPUT}")

          # 判断是 URL 还是本地文件路径
          if [[ "${IMAGE_INPUT}" =~ ^https?:// ]]; then
            echo "检测到 URL 链接，开始下载..."
            # 从 URL 下载
            if curl -fSL -o "fnnas/${IMAGE_NAME}" "${IMAGE_INPUT}"; then
              echo "下载成功：${IMAGE_INPUT}"
              echo "下载的文件名：${IMAGE_NAME}"
            else
              echo "错误：从 URL 下载失败 ${IMAGE_INPUT}"
              exit 1
            fi
          else
            # 本地文件路径：从仓库复制
            echo "检测到本地文件路径，开始复制..."
            if [[ -f "${{ github.workspace }}/${IMAGE_INPUT}" ]]; then
              cp "${{ github.workspace }}/${IMAGE_INPUT}" "fnnas/${IMAGE_NAME}"
              echo "已复制镜像：${IMAGE_INPUT}"
            else
              echo "错误：找不到本地镜像文件 ${IMAGE_INPUT}"
              echo "提示：请检查路径是否正确，或使用完整的 URL 链接"
              exit 1
            fi
          fi

          # 如果文件是 .xz 或 .gz 压缩格式
          if [[ "${{ inputs.image_is_compressed }}" == "true" ]]; then
            echo "镜像文件为压缩格式，构建时将自动解压"
          fi

          # 创建软链接供后续步骤使用
          ln -sf /builder/fnnas ${{ github.workspace }}/fnnas
          echo "status=success" >> ${GITHUB_OUTPUT}

      # ========== 构建内核升级包 ==========
      - name: 构建自定义 FnNAS 内核
        id: build_kernel
        uses: ophub/fnnas@main
        if: ${{ steps.prepare_image.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: kernel
          fnnas_path: fnnas/*.img
          debs_repo: ${{ inputs.kernel_source == 'debs_repo' && inputs.debs_repo || '' }}
          debs_install: ${{ inputs.kernel_source == 'debs_repo' && inputs.kernel_platform || 'none' }}
          dtbs_version: ${{ inputs.dtbs_version }}
          dtbs_install: ${{ inputs.dtbs_install }}

      # ========== 上传产物到 Releases ==========
      - name: 上传内核升级包到 Releases
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: custom_kernel_${{ github.run_number }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            自定义 FnNAS 内核升级包
            - 基础镜像来源：${{ inputs.fnnas_image_path }}
            - 内核来源：${{ inputs.kernel_source }}
            - 内核版本：${{ inputs.kernel_version }}
            - 硬件平台：${{ inputs.kernel_platform }}
            - 构建时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')
